version: "2"
sql:
  - engine: postgresql
    schema: migrations/00001_accounts.sql
    queries: internal/auth/queries.sql
    gen:
      go:
        package: store
        out: internal/auth/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
  - engine: postgresql
    schema: migrations/00001_accounts.sql
    queries: internal/user/queries.sql
    gen:
      go:
        package: store
        out: internal/user/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
  - engine: postgresql
    schema:
      - migrations/00001_accounts.sql
      - migrations/00002_exercises.sql
      - migrations/00003_exercise_glossary_names.sql
    queries: internal/exercise/queries.sql
    gen:
      go:
        package: store
        out: internal/exercise/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
  - engine: postgresql
    schema:
      - migrations/00001_accounts.sql
      - migrations/00002_exercises.sql
      - migrations/00003_exercise_glossary_names.sql
      - migrations/00004_workout_sessions.sql
      - migrations/00005_rpe_and_supersets.sql
    queries: internal/workout/queries.sql
    gen:
      go:
        package: store
        out: internal/workout/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - column: session_sets.rpe
            go_type:
              type: float64
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
