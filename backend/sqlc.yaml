version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/auth/queries.sql
    gen:
      go:
        package: store
        out: internal/auth/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
  - engine: postgresql
    schema: migrations
    queries: internal/user/queries.sql
    gen:
      go:
        package: store
        out: internal/user/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
  - engine: postgresql
    schema: migrations
    queries: internal/exercise/queries.sql
    gen:
      go:
        package: store
        out: internal/exercise/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
